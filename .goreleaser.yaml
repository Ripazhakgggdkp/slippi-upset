version: 2

builds:
  - binary: upset
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
    flags: [-trimpath] # no build-machine paths in the binary
    ldflags:
      - "-s -w -X main.version={{ .Version }}" # -s -w: strip debug info, ~30% smaller

archives:
  # Linux and macOS get a tar.gz, which keeps the executable bit.
  # Windows gets a bare .exe, so the README can link straight to it.
  - formats: [tar.gz]
    name_template: "upset_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - { goos: windows, formats: [binary] }

checksum:
  name_template: checksums.txt

# semantic-release already wrote the release notes from the commits.
changelog:
  disable: true
